summary: >
  The Center for Computational Systems Biology (CCSB) at Prairie View A&M University continues to advance multidisciplinary discovery across computational biology, precision nutrition, and community health. [**Thanmayee Yeluri**](/team/thanmayee-yeluri/), advised by [**Dr. Seungchan Kim**](/team/seungchan-kim/), will present her research on multimodal single-cell DNA methylation prediction as a short talk at DTMBIO 2026 in Osaka, Japan. In community health, the CCSB Seminar Series recently featured **Dr. Yulyu Yeh**, who presented on building community capacity for cancer prevention through family health history and community health workers. On the genomics and agriculture front, [**Dr. Tesfamichael H. Kebrom**](/team/tesfamichael-kebrom/), **Shantal A. Taylor**, **Wardah Mustahsan**, **Selamawit Woldesenbet**, **Almoutaz Elhassan**, and **Ripendra Awal** reported new insights into seed size influences on manure phytotoxicity bioassays. Concurrently, [**Dr. Seungchan Kim**](/team/seungchan-kim/) and national collaborators, led by **Saurabh Mehta**, published findings in *The Journal of Nutrition* outlining interdisciplinary training perspectives from the NIH T32 Artificial Intelligence for Precision Nutrition programs.
