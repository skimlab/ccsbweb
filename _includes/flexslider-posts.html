<div>
	<div class="flexslider" style="text-align: center; vertical-align: middle">
		<ul class="slides">
	  		{% for page in site.categories.papers limit:4 %}
	  		<li>
	  			<a href="{{ site.baseurl }}{{ page.url }}">
		    		<img src="{{ page.image | relative_url }}" class="img-fluid" style="max-width: 400px; width: 100%; height: auto; margin:0 auto">
		    		<p class="flex-caption">{{ page.ref }}</p>
		    	</a>
	 		</li>
	  		{% endfor %}
		</ul>
	</div>
</div>
